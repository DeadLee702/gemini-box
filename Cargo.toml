[package]
name = "gemini-box"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "gen_fixtures"
path = "src/bin/gen_fixtures.rs"

[[bin]]
name = "evk"
path = "src/bin/evk.rs"

[[bin]]
name = "analyze"
path = "src/bin/analyze.rs"

[[bin]]
name = "e01_extract"
path = "src/bin/e01_extract.rs"

[dependencies]
ed25519-dalek = "2.1"
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
hex = "0.4"
zip = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"

# E01 support - using libewf-sys for Encase format parsing
[dev-dependencies]
